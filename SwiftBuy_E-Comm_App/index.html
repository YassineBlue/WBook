<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwifBuy - Produits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bodyBg" id="top">

    <nav class="navbar navbar-expand-lg bg-light sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fa-solid fa-fire me-2"></i>Swift<span class="text-muted">Buy</span> 
            </a>
            <div class="col-md-5 mt-3 mt-md-0">
                <input type="text" id="search-input" class="form-control form-control-lg shadow-sm rounded-5"  placeholder="Rechercher un produit...">
            </div>
            <div class="d-flex align-items-center">
                <a href="cart.html" class="btn btn-outline-dark rounded-5 position-relative">
                    <i class="fa-solid fa-cart-shopping"></i> Panier
                    <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle rounded-pill bg-danger badge">
                        0
                    </span>
                </a>
            </div>
        </div>
    </nav>
    
    <div class="container my-2">
        <section class="col-md-12 ">
        <div class="hero">
            <h1 class="text-center display-6 fw-bold text-dark  p-0">Bienvenue sur SwiftBuy</h1>
        </div>
        </section> 
        <div class="row mb-2 py-3 px-5 z-1 align-items-center mb-4 bg-light rounded-4 justify-content-center">
            <div class="col-md-8 ">
                <h3 class="text-dark">Nos Produits</h3>
            </div>
            <div class="col-md-4">
                <select name="catg" id="category" class="form-select form-select-lg shadow-sm rounded-5">
                    <option value="" class="form-option">Toutes les catégories</option>
                    <option value="electronics" class="form-option">Électronique</option>
                    <option value="jewelery" class="form-option">Bijoux</option>
                    <option value="men's clothing" class="form-option">Vêtements hommes</option>
                    <option value="women's clothing" class="form-option">Vêtements femmes</option>
                </select>
            </div>
        </div>

        <div class="row g-3" id="products-container">

        </div>
        <a href="#top" class="mt-3 rounded-3 border-0 btn btn-sm shadow d-block mx-auto" id="toTop" title="Go back to top"><i class="fa-solid fa-angle-up" style="color:#000;"></i></a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js">
        
    </script>
</body>
</html>
